version: "3.8"

services:
  # MySQL 8.0 服务
  mysql:
    image: mysql:8.0
    container_name: kabuto-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      # 数据持久化
      - ${DOCKER_DATA_PATH}/mysql-kabuto/data:/var/lib/mysql
      # 日志持久化
      - ${DOCKER_DATA_PATH}/mysql-kabuto/logs:/var/log/mysql
      # 初始化脚本（用户创建 + 权限授予）
      - ./init-scripts:/docker-entrypoint-initdb.d
      # 建表 SQL（单一数据源，避免重复维护）
      - ../db/init.sql:/docker-entrypoint-initdb.d/01-schema.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --log-error=/var/log/mysql/error.log
      - --general-log=1
      - --general-log-file=/var/log/mysql/general.log
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - kabuto-network

  # Redis 7 服务
  redis:
    image: redis:7
    container_name: kabuto-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      # 数据持久化
      - ${DOCKER_DATA_PATH}/redis-kabuto/data:/data
      # 日志持久化
      - ${DOCKER_DATA_PATH}/redis-kabuto/logs:/var/log/redis
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - kabuto-network

networks:
  kabuto-network:
    driver: bridge
    name: kabuto-network
